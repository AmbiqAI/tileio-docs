name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    # Mirrors the site build environment in deploy.yaml: ubuntu-latest with
    # Python 3.11, which is the target environment tools/gen_notices.py
    # inventories.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Install Poetry and Python
        run: |
          uv python install 3.11
          uv tool install --python 3.11 --with 'certifi>=2026.10.19' --with 'virtualenv>=21.14.13' poetry==2.4.2
          poetry env use "$(uv python find 3.11)"
      - name: Install dependencies
        run: poetry sync --no-root --with dev
      - name: License classifier self-test
        run: poetry run python tools/gen_notices.py --selftest
      - name: Third-party notices are current and allow-listed
        run: poetry run python tools/gen_notices.py --check
      - name: Build the docs site
        # Not --strict: pre-existing broken links are tracked separately.
        run: poetry run mkdocs build
